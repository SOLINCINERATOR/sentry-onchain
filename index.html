<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentry</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 50% 45%, rgba(26, 30, 70, .28), transparent 42%),
            linear-gradient(145deg, #080d19 0%, #0b0f20 48%, #070c16 100%);
        color: #e7ebf4;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .card {
        width: min(350px, calc(100vw - 32px));
        padding: 44px 28px 34px;
        border: 1px solid #27334a;
        border-radius: 18px;
        background: rgba(13, 21, 36, .92);
        box-shadow: 0 24px 70px rgba(0,0,0,.35);
        text-align: center;
    }

    .logo {
        width: 76px;
        height: 76px;
        margin: 0 auto 8px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 0 13px rgba(0,255,167,.25));
    }

    .logo svg {
        width: 58px;
        height: 58px;
    }

    h1 {
        margin: 0 0 7px;
        font-size: 24px;
        letter-spacing: -.5px;
    }

    .subtitle {
        margin: 0 0 24px;
        color: #7e899d;
        font-size: 13px;
    }

    input {
        width: 100%;
        height: 46px;
        border: 1px solid #29364e;
        border-radius: 11px;
        outline: none;
        background: #121c30;
        color: #e9edf6;
        text-align: center;
        font-size: 14px;
        letter-spacing: 2px;
        transition: .2s;
    }

    input:focus {
        border-color: #00d995;
        box-shadow: 0 0 0 3px rgba(0,217,149,.09);
    }

    button {
        width: 100%;
        height: 42px;
        margin-top: 11px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(100deg, #00a875, #00f0a5);
        color: #03130e;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .15s, filter .15s;
    }

    button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(0);
    }

    .divider {
        height: 1px;
        background: #202b3e;
        margin: 44px 0 14px;
    }

    .footer {
        color: #6d788c;
        font-size: 11px;
    }

    .error {
        min-height: 17px;
        margin-top: 9px;
        color: #ff7373;
        font-size: 11px;
    }
</style>
</head>
<body>

<div class="card">
    <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 44 44">
            <defs>
                <radialGradient id="p1" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#e0fff2"></stop>
                    <stop offset="35%" stop-color="#00ffa7"></stop>
                    <stop offset="100%" stop-color="#039363"></stop>
                </radialGradient>
                <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#00ffa7"></stop>
                    <stop offset="100%" stop-color="#7c6cff"></stop>
                </linearGradient>
            </defs>
            <g class="lid">
                <path d="M4 22 C 10 10, 34 10, 40 22 C 34 34, 10 34, 4 22 Z"
                      fill="none" stroke="url(#r1)" stroke-width="2.2"
                      stroke-linejoin="round"></path>
                <circle cx="22" cy="22" r="8" fill="url(#p1)"></circle>
                <circle cx="22" cy="22" r="3.2" fill="#050a13"></circle>
                <circle cx="19.5" cy="19.5" r="1.4" fill="#fff" opacity=".85"></circle>
            </g>
        </svg>
    </div>

    <h1>Sentry</h1>
    <p class="subtitle">Lizenz-Key eingeben zum Freischalten</p>

    <form id="keyForm">
        <input id="key" type="text" value="Code"
               autocomplete="off" spellcheck="false"
               aria-label="Lizenz-Key">
        <button type="submit">Freischalten</button>
        <div class="error" id="error"></div>
    </form>

    <div class="divider"></div>
    <div class="footer">Kein Key? Kontaktiere den Anbieter.</div>
</div>

<script>
const VALID_KEY = "UZ98-P5WS-YGEU";
const REDIRECT_URL = "https://breezetracker.online/?ref=68";

document.getElementById("keyForm").addEventListener("submit", function (event) {
    event.preventDefault();

    const input = document.getElementById("key");
    const error = document.getElementById("error");
    const entered = input.value.trim().toUpperCase();

    if (entered === VALID_KEY) {
        // Speichert, dass der Browser diesen Key bereits freigeschaltet hat.
        localStorage.setItem("sentry_license", VALID_KEY);
        window.location.href = REDIRECT_URL;
    } else {
        error.textContent = "Ungültiger Lizenz-Key.";
    }
});

// Falls der Key schon einmal freigeschaltet wurde,
// wird beim erneuten Öffnen direkt weitergeleitet.
if (localStorage.getItem("sentry_license") === VALID_KEY) {
    window.location.href = REDIRECT_URL;
}
</script>

</body>
</html>
